name: Package desktop applications

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要覆盖附件的现有 Release tag（留空则只生成构建产物）"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

env:
  # Required by this repository's Node.js 20 policy. GitHub currently warns
  # that Node 20 is deprecated for JavaScript actions.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  macos-dmg:
    name: macOS universal DMG
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: "qtpdf"
          cache: true

      - name: Configure universal build
        run: cmake --preset macos-universal

      - name: Build application
        run: cmake --build --preset macos-universal --parallel

      - name: Smoke test UI interactions
        run: build/macos-universal/Notera.app/Contents/MacOS/Notera --ui-smoke-test

      - name: Upload UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Notera-macos-ui-screenshots
          path: notera-*-smoke.png
          if-no-files-found: warn

      - name: Create DMG
        run: cpack --config build/macos-universal/CPackConfig.cmake -G DragNDrop

      - name: Verify signed application bundle
        run: |
          bundle_path=$(find build/macos-universal/packages/_CPack_Packages -type d -name Notera.app -print -quit)
          test -n "$bundle_path"
          codesign --verify --deep --strict --verbose=2 "$bundle_path"

      - name: Smoke test application startup
        run: |
          bundle_path=$(find build/macos-universal/packages/_CPack_Packages -type d -name Notera.app -print -quit)
          "$bundle_path/Contents/MacOS/Notera" --theme-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --import-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --reader-smoke-test
          "$bundle_path/Contents/MacOS/Notera" >notera-startup.log 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid" || true
            cat notera-startup.log
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Notera-macos-universal-dmg
          path: build/macos-universal/packages/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: build/macos-universal/packages/*.dmg
          overwrite_files: true

  windows-msi:
    name: Windows x64 MSI
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset --yes --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: "win64_msvc2022_64"
          modules: "qtpdf"
          cache: true

      - name: Configure build
        shell: powershell
        run: cmake --preset windows-x64

      - name: Build application
        shell: powershell
        run: cmake --build --preset windows-x64 --parallel

      - name: Create MSI
        shell: powershell
        run: cpack --config build/windows-x64/CPackConfig.cmake -C Release -G WIX

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Notera-windows-x64-msi
          path: build/windows-x64/packages/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: build/windows-x64/packages/*.msi
          overwrite_files: true
