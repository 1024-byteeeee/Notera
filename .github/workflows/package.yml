name: Package desktop applications

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要覆盖附件的现有 Release tag（留空则只生成构建产物）"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-dmg:
    name: macOS arm64 DMG
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: "qtpdf"
          cache: true

      - name: Configure arm64 build
        run: cmake --preset macos-arm64

      - name: Build application
        run: cmake --build --preset macos-arm64 --parallel

      - name: Smoke test UI interactions
        run: |
          for attempt in 1 2 3; do
            if build/macos-arm64/Notera.app/Contents/MacOS/Notera --ui-smoke-test; then
              exit 0
            fi
            echo "UI smoke test attempt ${attempt} failed; retrying in a fresh process"
          done
          exit 1

      - name: Upload UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Notera-macos-ui-screenshots
          path: notera-*-smoke.png
          if-no-files-found: warn

      - name: Create DMG
        run: cpack --config build/macos-arm64/CPackConfig.cmake -G DragNDrop

      - name: Verify DMG filename and architecture
        shell: bash
        run: |
          shopt -s nullglob
          dmg_files=(build/macos-arm64/packages/Notera-v*-macOS-arm64.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected exactly one arm64 DMG, found ${#dmg_files[@]}"
            exit 1
          fi

          executable=$(find build/macos-arm64/packages/_CPack_Packages -path '*/Notera.app/Contents/MacOS/Notera' -print -quit)
          file "$executable" | grep -q "arm64"

      - name: Verify signed application bundle
        run: |
          bundle_path=$(find build/macos-arm64/packages/_CPack_Packages -type d -name Notera.app -print -quit)
          test -n "$bundle_path"
          codesign --verify --deep --strict --verbose=2 "$bundle_path"

      - name: Smoke test application startup
        run: |
          bundle_path=$(find build/macos-arm64/packages/_CPack_Packages -type d -name Notera.app -print -quit)
          "$bundle_path/Contents/MacOS/Notera" --theme-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --import-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --stitch-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --reader-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --folder-rename-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --storage-migration-smoke-test
          "$bundle_path/Contents/MacOS/Notera" --clear-data-smoke-test
          "$bundle_path/Contents/MacOS/Notera" >notera-startup.log 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid" || true
            cat notera-startup.log
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Notera-macos-arm64-dmg
          path: build/macos-arm64/packages/Notera-v*-macOS-arm64.dmg
          if-no-files-found: error

      - name: Remove legacy macOS assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"
          gh release view "$tag" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              case "$asset" in
                Notera-*-Darwin.dmg|Notera-v*-macOS-universal.dmg)
                  gh release delete-asset "$tag" "$asset" --yes
                  ;;
              esac
            done

      - name: Attach DMG to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: build/macos-arm64/packages/Notera-v*-macOS-arm64.dmg
          overwrite_files: true

  windows-msi:
    name: Windows x64 MSI
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset --yes --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: "win64_msvc2022_64"
          modules: "qtpdf"
          cache: true

      - name: Configure build
        shell: powershell
        run: cmake --preset windows-x64

      - name: Build application
        shell: powershell
        run: cmake --build --preset windows-x64 --parallel

      - name: Smoke test Windows behaviors
        shell: powershell
        run: |
          build/windows-x64/Release/Notera.exe --folder-rename-smoke-test
          build/windows-x64/Release/Notera.exe --storage-migration-smoke-test
          build/windows-x64/Release/Notera.exe --clear-data-smoke-test

      - name: Create MSI
        shell: powershell
        run: |
          cpack --config build/windows-x64/CPackConfig.cmake -C Release -G WIX
          if ($LASTEXITCODE -ne 0) {
            $wixLog = Get-ChildItem build/windows-x64/packages/_CPack_Packages -Recurse -Filter wix.log | Select-Object -First 1
            if ($wixLog) { Get-Content $wixLog.FullName }
            exit $LASTEXITCODE
          }

      - name: Verify Chinese installer and desktop shortcut option
        shell: powershell
        run: |
          $msi = Get-ChildItem build/windows-x64/packages/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI package was not generated" }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember(
            "OpenDatabase", "InvokeMethod", $null, $installer, @($msi.FullName, 0)
          )

          function Assert-MsiRow([string]$query, [string]$description) {
            $view = $database.GetType().InvokeMember(
              "OpenView", "InvokeMethod", $null, $database, @($query)
            )
            $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
            $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
            $view.GetType().InvokeMember("Close", "InvokeMethod", $null, $view, $null)
            if (-not $record) { throw "MSI validation failed: $description" }
          }

          Assert-MsiRow "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductLanguage' AND ``Value`` = '2052'" "installer language is not Simplified Chinese"
          Assert-MsiRow "SELECT ``Dialog`` FROM ``Dialog`` WHERE ``Dialog`` = 'NoteraOptionsDlg'" "options dialog is missing"
          Assert-MsiRow "SELECT ``Control`` FROM ``Control`` WHERE ``Dialog_`` = 'NoteraOptionsDlg' AND ``Control`` = 'DesktopShortcut' AND ``Property`` = 'INSTALLDESKTOPSHORTCUT'" "desktop shortcut checkbox is missing"
          Assert-MsiRow "SELECT ``Feature`` FROM ``Feature`` WHERE ``Feature`` = 'DesktopShortcutFeature'" "desktop shortcut feature is missing"
          Assert-MsiRow "SELECT ``Shortcut`` FROM ``Shortcut`` WHERE ``Shortcut`` = 'NoteraDesktopShortcut'" "desktop shortcut is missing"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: Notera-windows-x64-msi
          path: build/windows-x64/packages/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: build/windows-x64/packages/*.msi
          overwrite_files: true
