name: Package desktop applications

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  # Required by this repository's Node.js 20 policy. GitHub currently warns
  # that Node 20 is deprecated for JavaScript actions.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  macos-dmg:
    name: macOS universal DMG
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: "qtpdf"
          cache: true

      - name: Configure universal build
        run: cmake --preset macos-universal

      - name: Build application
        run: cmake --build --preset macos-universal --parallel

      - name: Create DMG
        run: cpack --config build/macos-universal/CPackConfig.cmake -G DragNDrop

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Notera-macos-universal-dmg
          path: build/macos-universal/packages/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos-universal/packages/*.dmg

  windows-msi:
    name: Windows x64 MSI
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset --yes --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: "win64_msvc2022_64"
          modules: "qtpdf"
          cache: true

      - name: Configure build
        shell: powershell
        run: cmake --preset windows-x64

      - name: Build application
        shell: powershell
        run: cmake --build --preset windows-x64 --parallel

      - name: Create MSI
        shell: powershell
        run: cpack --config build/windows-x64/CPackConfig.cmake -C Release -G WIX

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Notera-windows-x64-msi
          path: build/windows-x64/packages/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows-x64/packages/*.msi
